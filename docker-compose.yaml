services:
  # 1. Database PostgreSQL
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Backend của bạn
  app:
    build:
      context: .           # Trỏ vào thư mục hiện tại để tìm Dockerfile
    container_name: node_app
    ports:
      - "3000:3000"        # Ánh xạ port 3000 của máy tính vào port 3000 của container
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env               # Load các biến môi trường từ file .env (nếu có)